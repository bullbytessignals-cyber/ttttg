<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TheCarders.Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600;700;900&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  min-height: 100vh;
  background: #1a1a1a;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Inter', sans-serif;
}

.poster {
  width: 620px;
  height: 876px;
  position: relative;
  overflow: hidden;
  background: linear-gradient(170deg, #0e0300 0%, #3b0900 25%, #8c2200 55%, #c94800 80%, #e05a00 100%);
  flex-shrink: 0;
}

/* Sunburst rays */
.poster::before {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-conic-gradient(
    from 0deg at 50% 52%,
    rgba(255, 190, 80, 0.055) 0deg 7deg,
    transparent 7deg 14deg
  );
}

/* Center radial glow */
.poster::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 70% 50% at 50% 52%, rgba(255,140,30,0.18) 0%, transparent 70%);
}

/* ── TOP BAR ── */
.top-bar {
  position: absolute;
  top: 30px; left: 34px; right: 34px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 10;
}
.top-label {
  font-size: 10px;
  letter-spacing: 3.5px;
  text-transform: uppercase;
  color: rgba(255, 220, 140, 0.65);
  font-weight: 700;
}
.top-badge {
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: rgba(255, 220, 140, 0.65);
  font-weight: 700;
  border: 1px solid rgba(255,200,80,0.3);
  padding: 4px 12px;
  border-radius: 2px;
}

/* ── SCRIPT SUBTITLE ── */
.script-line {
  position: absolute;
  top: 82px;
  left: 0; right: 0;
  text-align: center;
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: 20px;
  color: rgba(255, 215, 130, 0.6);
  letter-spacing: 1px;
  z-index: 10;
}

/* ── BIG OUTLINE TEXT ── */
.big-word {
  position: absolute;
  top: 106px;
  left: 0; right: 0;
  text-align: center;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 158px;
  letter-spacing: 10px;
  line-height: 1;
  color: transparent;
  -webkit-text-stroke: 2.5px rgba(255, 255, 255, 0.82);
  user-select: none;
  z-index: 5;
}

/* ── CARD STAGE ── */
.card-stage {
  position: absolute;
  top: 250px;
  left: 50%;
  transform: translateX(-50%);
  width: 380px;
  height: 230px;
  z-index: 8;
}

.card {
  position: absolute;
  width: 270px;
  height: 168px;
  border-radius: 15px;
  overflow: hidden;
}

.card-l {
  left: 0; top: 28px;
  transform: rotate(-11deg) translateX(-10px);
  background: linear-gradient(140deg, #1e0a00, #5c1e00, #3a0d00);
  box-shadow: 0 16px 50px rgba(0,0,0,0.6);
  opacity: 0.72;
}

.card-r {
  right: 0; top: 28px;
  transform: rotate(11deg) translateX(10px);
  background: linear-gradient(140deg, #001a12, #003d22, #001f10);
  box-shadow: 0 16px 50px rgba(0,0,0,0.6);
  opacity: 0.72;
}

.card-c {
  left: 50%;
  top: 0;
  transform: translateX(-50%);
  background: linear-gradient(150deg, #0f1c35 0%, #1a2f55 45%, #0c2245 100%);
  box-shadow:
    0 24px 64px rgba(0, 0, 0, 0.75),
    0 0 0 1px rgba(255, 200, 80, 0.2),
    inset 0 1px 0 rgba(255,255,255,0.08);
  z-index: 3;
}

.chip {
  position: absolute;
  top: 24px; left: 22px;
  width: 40px; height: 30px;
  border-radius: 5px;
  background: linear-gradient(135deg, #e8c55a 0%, #c09010 50%, #e8c55a 100%);
  box-shadow: inset 0 1px 2px rgba(255,255,255,0.4), 0 2px 4px rgba(0,0,0,0.4);
}
.chip::before {
  content: '';
  position: absolute;
  inset: 5px;
  border: 1px solid rgba(0,0,0,0.18);
  border-radius: 3px;
}
.chip::after {
  content: '';
  position: absolute;
  top: 50%; left: 0; right: 0;
  height: 1px;
  background: rgba(0,0,0,0.15);
  transform: translateY(-50%);
}

.card-num {
  position: absolute;
  bottom: 42px; left: 22px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 15px;
  letter-spacing: 4px;
  color: rgba(255,255,255,0.45);
}

.card-holder {
  position: absolute;
  bottom: 18px; left: 22px;
  font-size: 9px;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.38);
  font-weight: 700;
}

.card-logo {
  position: absolute;
  bottom: 16px; right: 20px;
  display: flex;
}
.logo-c {
  width: 26px; height: 26px;
  border-radius: 50%;
  display: block;
}
.logo-c:first-child {
  background: rgba(255,160,30,0.65);
  margin-right: -9px;
  z-index: 1;
}
.logo-c:last-child {
  background: rgba(210,40,40,0.55);
}

.shine {
  position: absolute;
  inset: 0;
  background: linear-gradient(128deg, rgba(255,255,255,0.09) 0%, transparent 55%);
}

.nfc {
  position: absolute;
  top: 22px; right: 20px;
  width: 22px; height: 22px;
  opacity: 0.3;
}
.nfc-arc {
  position: absolute;
  border: 1.5px solid #fff;
  border-radius: 50%;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
}

/* ── BOTTOM SECTION ── */
.bottom {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 30px 34px 44px;
  background: linear-gradient(0deg, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.2) 60%, transparent 100%);
  z-index: 10;
}

.brand {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 52px;
  letter-spacing: 10px;
  color: #ffffff;
  line-height: 1;
  margin-bottom: 3px;
  text-shadow: 0 2px 20px rgba(255,150,50,0.3);
}
.brand-dot {
  color: rgba(255, 200, 80, 0.8);
}

.sub-brand {
  font-size: 11px;
  letter-spacing: 5px;
  text-transform: uppercase;
  color: rgba(255, 210, 120, 0.55);
  font-weight: 700;
  margin-bottom: 18px;
}

.rule {
  width: 100%;
  height: 1px;
  background: linear-gradient(90deg, rgba(255,180,60,0.5) 0%, rgba(255,180,60,0.15) 60%, transparent 100%);
  margin-bottom: 16px;
}

.tagline {
  font-size: 12.5px;
  color: rgba(255, 220, 160, 0.6);
  letter-spacing: 2px;
  text-transform: uppercase;
  font-weight: 600;
  line-height: 1.8;
  margin-bottom: 20px;
}

.tags {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 22px;
}
.tag {
  font-size: 9.5px;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  font-weight: 700;
  color: rgba(255, 210, 120, 0.7);
  border: 1px solid rgba(255, 190, 60, 0.28);
  padding: 5px 14px;
  border-radius: 2px;
}

.url-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.url {
  font-size: 11.5px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.28);
  font-weight: 600;
}
.url strong {
  color: rgba(255, 210, 100, 0.75);
}

.socials {
  display: flex;
  gap: 12px;
}
.soc-icon {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 1px solid rgba(255,190,60,0.25);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: rgba(255, 210, 120, 0.5);
}

/* accent lines */
.accent-left {
  position: absolute;
  left: 0; top: 50%;
  transform: translateY(-50%);
  width: 3px; height: 120px;
  background: linear-gradient(180deg, transparent, rgba(255,180,60,0.5), transparent);
  z-index: 9;
}
.accent-right {
  position: absolute;
  right: 0; top: 50%;
  transform: translateY(-50%);
  width: 3px; height: 120px;
  background: linear-gradient(180deg, transparent, rgba(255,180,60,0.5), transparent);
  z-index: 9;
}

/* corner ticks */
.tick {
  position: absolute;
  width: 20px; height: 20px;
  z-index: 10;
  opacity: 0.45;
}
.tick-tl { top: 20px; left: 20px; border-top: 1.5px solid #f0b040; border-left: 1.5px solid #f0b040; }
.tick-tr { top: 20px; right: 20px; border-top: 1.5px solid #f0b040; border-right: 1.5px solid #f0b040; }
.tick-bl { bottom: 30px; left: 20px; border-bottom: 1.5px solid #f0b040; border-left: 1.5px solid #f0b040; }
.tick-br { bottom: 30px; right: 20px; border-bottom: 1.5px solid #f0b040; border-right: 1.5px solid #f0b040; }
</style>
</head>
<body>

<div class="poster">

  <div class="tick tick-tl"></div>
  <div class="tick tick-tr"></div>
  <div class="tick tick-bl"></div>
  <div class="tick tick-br"></div>

  <div class="accent-left"></div>
  <div class="accent-right"></div>

  <div class="top-bar">
    <span class="top-label">Official Poster</span>
    <span class="top-badge">Est. 2025</span>
  </div>

  <div class="script-line">Premium Card Services</div>

  <div class="big-word">CARDERS</div>

  <div class="card-stage">

    <div class="card card-l">
      <div class="shine"></div>
    </div>

    <div class="card card-r">
      <div class="shine"></div>
    </div>

    <div class="card card-c">
      <div class="chip"></div>
      <div class="nfc">
        <div class="nfc-arc" style="width:8px;height:8px;"></div>
        <div class="nfc-arc" style="width:14px;height:14px;"></div>
        <div class="nfc-arc" style="width:20px;height:20px;"></div>
      </div>
      <div class="card-num">•••• &nbsp;•••• &nbsp;•••• &nbsp;7799</div>
      <div class="card-holder">The Carders</div>
      <div class="card-logo">
        <span class="logo-c"></span>
        <span class="logo-c"></span>
      </div>
      <div class="shine"></div>
    </div>

  </div>

  <div class="bottom">
    <div class="brand">THE CARDERS<span class="brand-dot">.</span></div>
    <div class="sub-brand">Shop &nbsp;·&nbsp; Premium Digital Cards</div>
    <div class="rule"></div>
    <div class="tagline">
      Your exclusive destination for<br>
      premium &amp; verified card services
    </div>
    <div class="tags">
      <div class="tag">Premium</div>
      <div class="tag">Secure</div>
      <div class="tag">Worldwide</div>
      <div class="tag">24 / 7 Support</div>
    </div>
    <div class="url-row">
      <div class="url">www.<strong>thecarders</strong>.shop</div>
      <div class="socials">
        <div class="soc-icon">𝕏</div>
        <div class="soc-icon">in</div>
        <div class="soc-icon">@</div>
      </div>
    </div>
  </div>

</div>

</body>
</html>
